# Project OMP settings. Model fallbacks are intentionally disabled.
# Each call either uses its requested model/provider or fails.
#
# Previous fallback configuration, retained for easy re-enabling:
# retry:
#   enabled: true
#   modelFallback: false
#   usageAwareFallback: true
#   usageReservePct: 0
#   usageReservePolicy: auto
#   fallbackChains:
#     openai-codex/gpt-5.6-sol:
#       - openrouter/openai/gpt-5.6-sol
#     openai-codex/gpt-5.6-luna:
#       - openrouter/openai/gpt-5.6-luna
#     cursor/cursor-grok-4.6:
#       - openrouter/x-ai/grok-4.6

retry:
  enabled: true
  modelFallback: false
  usageAwareFallback: false
