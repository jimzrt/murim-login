name: Publish Chapter 374 Expedition Ebook

on:
  push:
    branches: [expedition/chapter-374]
    paths:
      - "translations/**"
      - "docs/**"
      - "tools/**"
      - "cover.jpg"
      - ".github/workflows/expedition-ebook.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Immutable tag, or leave empty for the rolling expedition release"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: expedition-ebook-release
  cancel-in-progress: true

jobs:
  release:
    if: ${{ hashFiles('translations/0374.md') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pandoc/actions/setup@v1
        with:
          version: 3.6.4
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: 0.15.1
      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-noto-extra fonts-noto-mono
          sudo fc-cache -f
      - name: Validate expedition
        run: python tools/expedition.py check
      - name: Build PDF and EPUB
        run: python tools/build.py --format pdf && python tools/build.py --format epub
      - name: Publish expedition release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-expedition-ebook}"
          sha="${GITHUB_SHA:0:7}"
          chapters="$(find translations -maxdepth 1 -name '[0-9][0-9][0-9][0-9].md' | wc -l)"
          notes="$(printf 'Chapter 374 expedition from `%s` (%s local English chapters). Chapters 65–373 are skipped or source-only bridge material. Rolling builds overwrite `expedition-ebook`; custom tags are immutable.' "$sha" "$chapters")"
          if [ "$tag" = "expedition-ebook" ] && gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" build/murim-login.pdf build/murim-login.epub --clobber
            gh release edit "$tag" --title "Murim Login — Chapter 374 Expedition" --notes "$notes"
          else
            gh release create "$tag" build/murim-login.pdf build/murim-login.epub \
              --title "Murim Login — Chapter 374 Expedition" --notes "$notes"
          fi
